# Jekyll configuration for studiospacefarer.com
#
# GitHub Pages already builds this repo with Jekyll — it does so for every Pages site
# unless a .nojekyll file is present, and there isn't one.
#
# index.html carries empty front matter (--- / ---) and no layout: of its own. That's
# enough to turn Liquid processing on — needed so its devlog teaser can pull
# site.posts.first server-side instead of fetching it with client-side JS, the exact
# anti-pattern (invisible to crawlers) this whole devlog migration was done to get away
# from — while the page still renders as its own standalone document, untouched by
# _layouts/default.html's header/nav chrome, which index.html already has its own copy of.
#
# Do not add .nojekyll, and do not migrate to another static site generator.

title: Studio Spacefarer
description: >-
  Devlog and games from Studio Spacefarer — a dad making games like The Waking Cloak
  and ProtoDungeon in his spare time.
url: "https://studiospacefarer.com"
baseurl: ""
lang: en

# Posts live under /devlog/ so the listing page and the posts share a path.
permalink: /devlog/:year/:month/:day/:title/

# Both plugins are on the GitHub Pages supported-plugins allowlist, so they need no
# custom build step or Action. RSS is required rather than optional: it is the most
# durable non-social channel available, and the digest compiler reads from it.
plugins:
  - jekyll-feed
  - jekyll-sitemap

feed:
  path: feed.xml

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

# CSS lane: stylesheets are compiled LOCALLY and the compiled output is committed.
# Jekyll treats the resulting .css files as ordinary static assets and never touches
# them. The sources are excluded from the built site so only the compiled CSS ships.
#
# This is a deliberate choice between the two options — the alternative is moving fully
# to Jekyll's _sass/ convention and not committing app.css. Do not half-do both: if
# Jekyll ever also produced app.css the two would fight over the same output path.
# Stylus is not supported by Jekyll at all, so stars.styl stays a local build regardless.
exclude:
  - app.scss
  - app.css.map
  - stars.styl
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - .vscode
  - vendor
